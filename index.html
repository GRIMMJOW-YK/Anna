<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sansad Showdown - 2D Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #f2a65a, #ffcc66);
            overflow: hidden;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* UI - Health and Shakti Bars */
        .ui-container {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .player-ui {
            width: 40%;
        }

        .name {
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 5px;
        }

        .health-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        .health-bar {
            height: 100%;
            width: 100%;
            background-color: #ffcc00;
            transition: width 0.2s;
        }

        .shakti-bar-bg {
            width: 80%;
            height: 10px;
            background-color: #333;
            border: 1px solid #fff;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }

        .shakti-bar {
            height: 100%;
            width: 0%;
            background-color: #00ccff;
            transition: width 0.2s;
        }

        /* Controls Overlay */
        .controls {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }
        
        .btn {
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            margin: 0 5px;
            border: 2px solid white;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #ffcc00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI Elements -->
        <div class="ui-container">
            <div class="player-ui">
                <div class="name">MITRAMAN (YOU)</div>
                <div class="health-bar-bg"><div class="health-bar" id="p1-health"></div></div>
                <div class="shakti-bar-bg"><div class="shakti-bar" id="p1-shakti"></div></div>
            </div>
            <div class="player-ui" style="text-align: right;">
                <div class="name">YATRA BOY (CPU)</div>
                <div class="health-bar-bg"><div class="health-bar" id="p2-health" style="float: right;"></div></div>
                <div class="shakti-bar-bg" style="float: right;"><div class="shakti-bar" id="p2-shakti" style="float: right;"></div></div>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- On-screen Controls (Visual only for this prototype) -->
        <div class="controls">
            <div>
                <div class="btn" style="margin-bottom: 5px;">W</div>
                <div style="display:flex;">
                    <div class="btn">A</div>
                    <div class="btn">S</div>
                    <div class="btn">D</div>
                </div>
            </div>
            <div style="display:flex; align-items: flex-end;">
                <div class="btn" style="background: #ff6666;">P<br>F</div>
                <div class="btn" style="background: #66b3ff;">K<br>G</div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over">
            <h2 id="winner-text">MITRAMAN WINS!</h2>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const p1HealthEl = document.getElementById('p1-health');
        const p2HealthEl = document.getElementById('p2-health');
        const p1ShaktiEl = document.getElementById('p1-shakti');
        const p2ShaktiEl = document.getElementById('p2-shakti');
        const gameOverScreen = document.getElementById('game-over');
        const winnerText = document.getElementById('winner-text');

        // Game State
        let gameRunning = true;
        const gravity = 0.5;
        const groundY = 330;

        // Input Handling
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Fighter Class
        class Fighter {
            constructor(x, y, color, isPlayer) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 70;
                this.color = color;
                this.vy = 0;
                this.speed = 4;
                this.isPlayer = isPlayer;
                this.health = 100;
                this.shakti = 0;
                this.facing = isPlayer ? 1 : -1;
                this.isAttacking = false;
                this.attackTimer = 0;
                this.attackType = '';
                this.hitCooldown = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Draw "head"
                ctx.fillStyle = '#ffdbac';
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y - 10, 15, 0, Math.PI * 2);
                ctx.fill();

                // Draw attack hitbox
                if (this.isAttacking) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    if (this.attackType === 'punch') {
                        let hitX = this.facing === 1 ? this.x + this.width : this.x - 30;
                        ctx.fillRect(hitX, this.y + 10, 30, 20);
                    } else if (this.attackType === 'kick') {
                        let hitX = this.facing === 1 ? this.x + this.width : this.x - 40;
                        ctx.fillRect(hitX, this.y + 40, 40, 20);
                    }
                }
            }

            update() {
                // Gravity
                this.y += this.vy;
                if (this.y + this.height < groundY) {
                    this.vy += gravity;
                } else {
                    this.y = groundY - this.height;
                    this.vy = 0;
                }

                // Attack cooldown
                if (this.hitCooldown > 0) this.hitCooldown--;
                
                if (this.isAttacking) {
                    this.attackTimer--;
                    if (this.attackTimer <= 0) this.isAttacking = false;
                }

                // Player Controls
                if (this.isPlayer && gameRunning) {
                    if (keys['a'] && this.x > 0) { this.x -= this.speed; this.facing = -1; }
                    if (keys['d'] && this.x < canvas.width - this.width) { this.x += this.speed; this.facing = 1; }
                    if (keys['w'] && this.y >= groundY - this.height) { this.vy = -10; }
                    
                    // Attacks
                    if (!this.isAttacking) {
                        if (keys['f']) this.attack('punch');
                        if (keys['g']) this.attack('kick');
                    }
                }
            }

            attack(type) {
                this.isAttacking = true;
                this.attackType = type;
                this.attackTimer = 15; // frames
                this.hitCooldown = 30; 
                checkHit(this, this.isPlayer ? enemy : player, type);
            }
        }

        // Initialize Fighters
        let player = new Fighter(200, groundY - 70, '#f28c28', true); // Orange (Mitraman)
        let enemy = new Fighter(550, groundY - 70, '#e0e0e0', false); // White (Yatra Boy)

        // Basic AI for Enemy
        function updateAI() {
            if (!gameRunning) return;
            
            let distance = Math.abs(player.x - enemy.x);
            
            // Face the player
            enemy.facing = player.x > enemy.x ? 1 : -1;

            // Move towards player if far
            if (distance > 80) {
                if (enemy.facing === 1) enemy.x += 2;
                if (enemy.facing === -1) enemy.x -= 2;
            } 
            // Attack if close
            else if (!enemy.isAttacking && enemy.hitCooldown <= 0) {
                if (Math.random() < 0.05) { // 5% chance per frame to attack
                    enemy.attack(Math.random() < 0.5 ? 'punch' : 'kick');
                }
            }
        }

        // Collision Detection & Damage
        function checkHit(attacker, defender, type) {
            // Simple AABB collision for the hitbox
            let hitX, hitW;
            if (type === 'punch') {
                hitX = attacker.facing === 1 ? attacker.x + attacker.width : attacker.x - 30;
                hitW = 30;
            } else {
                hitX = attacker.facing === 1 ? attacker.x + attacker.width : attacker.x - 40;
                hitW = 40;
            }
            
            let hitY = type === 'punch' ? attacker.y + 10 : attacker.y + 40;
            let hitH = 20;

            if (
                hitX < defender.x + defender.width &&
                hitX + hitW > defender.x &&
                hitY < defender.y + defender.height &&
                hitY + hitH > defender.y
            ) {
                // Hit landed!
                if (defender.hitCooldown <= 0) {
                    let damage = type === 'punch' ? 8 : 12;
                    defender.health -= damage;
                    defender.hitCooldown = 20; // i-frames
                    
                    // Add Shakti
                    attacker.shakti = Math.min(100, attacker.shakti + 15);
                    
                    updateUI();
                    checkWinCondition();
                }
            }
        }

        function updateUI() {
            p1HealthEl.style.width = Math.max(0, player.health) + '%';
            p2HealthEl.style.width = Math.max(0, enemy.health) + '%';
            p1ShaktiEl.style.width = player.shakti + '%';
            p2ShaktiEl.style.width = enemy.shakti + '%';
        }

        function checkWinCondition() {
            if (player.health <= 0 || enemy.health <= 0) {
                gameRunning = false;
                gameOverScreen.style.display = 'block';
                winnerText.innerText = player.health <= 0 ? 'YATRA BOY WINS!' : 'MITRAMAN WINS!';
            }
        }

        function resetGame() {
            player = new Fighter(200, groundY - 70, '#f28c28', true);
            enemy = new Fighter(550, groundY - 70, '#e0e0e0', false);
            gameRunning = true;
            gameOverScreen.style.display = 'none';
            updateUI();
        }

        // Game Loop
        function gameLoop() {
            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background (Parliament style)
            ctx.fillStyle = '#d4a373';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Floor
            ctx.fillStyle = '#faedcd';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Draw some lines on floor
            ctx.strokeStyle = '#e9edc9';
            ctx.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath();
                ctx.moveTo(i, groundY);
                ctx.lineTo(i - 50, canvas.height);
                ctx.stroke();
            }

            if (gameRunning) {
                player.update();
                enemy.update();
                updateAI();
            }

            player.draw();
            enemy.draw();

            requestAnimationFrame(gameLoop);
        }

        // Start Game
        resetGame();
        gameLoop();

    </script>
</body>
  </html>
